[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "diffusion2-sedd"
version = "0.1.0"
description = "SEDD utilities for measurement-altered criticality experiments"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "torch",
]

[tool.setuptools.packages.find]
include = ["sedd*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
